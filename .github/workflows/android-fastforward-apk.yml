# Builds the Android APK for this personal fast-forward fork and publishes it as a
# release asset, so there's a plain download link for it.
name: Android APK

on:
  push:
    branches:
      - claude/dolphin-android-speed-toggle-m5ybv8
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Handles cmdline-tools discovery and PATH; the runner image layout for these has
      # moved around and hardcoding it is what broke the first two runs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install NDK and CMake
        run: |
          set -uo pipefail
          {
            PINNED=$(grep -oP 'dolphinNdkVersion.*\?: "\K[^"]+' Source/Android/app/build.gradle.kts)
            echo "Pinned NDK: $PINNED"
            sdkmanager --list_installed || true

            # Deliberately not installing platforms/build-tools here: compileSdk 37 may not be
            # published to sdkmanager yet, and a missing package would hard-fail the step.
            # AGP downloads whatever platform it needs on its own.
            CMAKE=$(sdkmanager --list 2>/dev/null | grep -oP '^\s*cmake;\K[0-9][0-9.]*' \
              | sort -V | tail -n1)
            echo "Newest available CMake: ${CMAKE:-<none found>}"
            if [ -n "$CMAKE" ]; then
              sdkmanager --install "cmake;$CMAKE" || echo "CMake install failed; letting AGP resolve it"
            fi

            if ! sdkmanager --install "ndk;$PINNED"; then
              AVAILABLE=$(sdkmanager --list 2>/dev/null | grep -oP '^\s*ndk;\K[0-9][0-9.]*' \
                | sort -V | tail -n1)
              echo "NDK $PINNED unavailable, falling back to ${AVAILABLE:-<none found>}"
              [ -n "$AVAILABLE" ] || exit 1
              sdkmanager --install "ndk;$AVAILABLE" || exit 1
              echo "NDK_OVERRIDE=$AVAILABLE" >> "$GITHUB_ENV"
            fi
          } 2>&1 | tee -a /tmp/ci-step.log
          exit "${PIPESTATUS[0]}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (arm64-v8a)
        working-directory: Source/Android
        run: |
          set -uo pipefail
          ./gradlew --no-daemon -PdolphinAbiFilters=arm64-v8a \
            ${NDK_OVERRIDE:+-PdolphinNdkVersion=${NDK_OVERRIDE}} \
            assembleDebug 2>&1 | tee -a /tmp/ci-step.log
          exit "${PIPESTATUS[0]}"

      - name: Name the APK
        id: apk
        run: |
          SRC=Source/Android/app/build/outputs/apk/debug/app-debug.apk
          DEST="dolphin-fastforward-arm64-${GITHUB_SHA::8}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "tag=android-fastforward-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # Uploaded twice on purpose: the artifact is handy from the run page, the release
      # asset is a direct link that doesn't require being signed in.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-fastforward-arm64
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.path }}" \
            --title "Fast-forward test build (${GITHUB_SHA::8})" \
            --notes "Debug build of the Android fast-forward branch, arm64-v8a only. Installs alongside official Dolphin (application id suffix .debug)." \
            --prerelease

      # Issues are disabled on forks by default, and the job log tail is buried under
      # actions/checkout's submodule cleanup, so push the captured output to a branch
      # where it can be read back through the contents API.
      - name: Report failure
        if: failure()
        run: |
          set -eu
          mkdir -p /tmp/ci-logs
          cp /tmp/ci-step.log "/tmp/ci-logs/${GITHUB_SHA::8}.log" 2>/dev/null \
            || echo "no step log captured" > "/tmp/ci-logs/${GITHUB_SHA::8}.log"
          cd /tmp/ci-logs
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "CI log for ${GITHUB_SHA::8}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/ci-logs
